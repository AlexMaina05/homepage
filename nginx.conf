server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml application/manifest+json;

    # PWA Service Worker - Must never be cached to allow instant updates
    location /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # PWA Webmanifest - Revalidate frequently
    location ~* \.(webmanifest|manifest\.json)$ {
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Static assets with hash in filename (cache long term)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Config JSON (services.json)
    location = /services.json {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
